# A stand-in for AnkiMobile in the iPhone Simulator, where the real AnkiMobile
# cannot be installed, and a UI test that plays the player: run.sh says how it
# is used. Generated with XcodeGen like the app's own project; the .xcodeproj
# is not kept in git.
name: AnkiStandIn
options:
  bundleIdPrefix: org.local
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  AnkiStandIn:
    type: application
    platform: iOS
    sources:
      - path: StandIn
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.ankistandin
        PRODUCT_NAME: AnkiStandIn
        INFOPLIST_FILE: StandIn/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  AnkiStandInUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AnkiStandIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.local.ankistandin.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AnkiStandIn
schemes:
  AnkiStandIn:
    build:
      targets:
        AnkiStandIn: all
        AnkiStandInUITests: [test]
    test:
      targets:
        - AnkiStandInUITests
