# Checks the cards that go straight into the Anki app on the same device
# (docs/MINING.md) where no unit test reaches: the Apple side against a
# stand-in for AnkiMobile in the iPhone Simulator, the Android side against the
# real AnkiDroid in an emulator. It runs when a pull request touches that code,
# or by hand.
#
# Both jobs run on GitHub's standard runners, which cost nothing for a public
# repository.
name: Anki apps

on:
  pull_request:
    paths:
      - "engine/src/mining/anki_app*"
      - "engine/src/api/ore_anki_check.cpp"
      - "engine/src/platform/apple/apple_anki.mm"
      - "app/Sources/App/AnkiCheck.swift"
      - "tools/apple/ankimobile-standin/**"
      - "android/app/src/**/AnkiDroid*.kt"
      - "android/app/src/**/MiningSettings*.kt"
      - "android/app/src/main/res/layout/mining_settings.xml"
      - "android/app/src/**/AnkiMediaProvider.kt"
      - "android/app/src/**/AndroidManifest.xml"
      - "tools/android/ankidroid_check.sh"
      - ".github/workflows/anki-apps.yml"
  workflow_dispatch:

concurrency:
  group: anki-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ankimobile:
    name: AnkiMobile stand-in in the iPhone Simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Round trip of the lists and three cards
        run: tools/apple/ankimobile-standin/run.sh

      - name: Keep what the check found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankimobile-standin-${{ github.sha }}
          path: |
            build/ankimobile-standin/results
            build/ankimobile-standin/result.xcresult
          if-no-files-found: warn

  ankidroid:
    name: AnkiDroid in an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Twice more when it fails: the servers the build's own parts come from
      # turn a runner away now and then ("Too Many Requests").
      - name: Build the debug app, with lint
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon :app:lintDebug :app:assembleDebug && exit 0
            [ "$attempt" = 3 ] || sleep $((attempt * 60))
          done
          exit 1

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cards into the real AnkiDroid
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/android/ankidroid_check.sh

      - name: Keep what the check found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankidroid-check-${{ github.sha }}
          path: |
            build/ankidroid-check
            !build/ankidroid-check/work
          if-no-files-found: warn
